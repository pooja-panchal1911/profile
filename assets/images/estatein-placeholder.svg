<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="estateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="estShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#estateGrad)"/>
  
  <g transform="translate(40, 40)" filter="url(#estShadow)">
    <rect width="720" height="520" rx="14" fill="#141414" stroke="#2e2e2e" stroke-width="1.5"/>
    <rect width="720" height="44" rx="14" fill="#1f1f1f"/>
    
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#121212" stroke="#333333" stroke-width="1"/>
    <text x="250" y="26" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="500">https://estatein-prime.com/properties</text>

    <!-- Header -->
    <rect x="0" y="44" width="720" height="56" fill="#171717" stroke-bottom="#2a2a2a" stroke-width="1"/>
    <text x="32" y="79" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="800" letter-spacing="-0.5">ESTATE<tspan fill="#ff7a00">IN</tspan></text>
    <text x="160" y="77" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">Home</text>
    <text x="230" y="77" fill="#a1a1aa" font-family="system-ui" font-size="12">About Us</text>
    <text x="310" y="77" fill="#a1a1aa" font-family="system-ui" font-size="12">Properties</text>
    <text x="400" y="77" fill="#a1a1aa" font-family="system-ui" font-size="12">Services</text>
    
    <rect x="590" y="58" width="98" height="28" rx="6" fill="#262626" stroke="#ff7a00" stroke-width="1"/>
    <text x="608" y="76" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="700">Contact Us</text>

    <!-- Hero banner with property visual -->
    <g transform="translate(32, 115)">
      <!-- Main showcase card -->
      <rect width="420" height="375" rx="10" fill="#1f1f1f" stroke="#333333" stroke-width="1"/>
      
      <!-- Architectural Villa Image Simulation -->
      <rect x="12" y="12" width="396" height="200" rx="8" fill="#292524"/>
      <!-- Minimalist modern villa geometry -->
      <rect x="50" y="50" width="320" height="130" fill="#44403c"/>
      <rect x="90" y="70" width="160" height="90" fill="#222"/>
      <line x1="90" y1="115" x2="250" y2="115" stroke="#78716c" stroke-width="1"/>
      <line x1="170" y1="70" x2="170" y2="160" stroke="#78716c" stroke-width="1"/>
      <rect x="260" y="60" width="80" height="120" fill="#1c1917"/>
      <rect x="30" y="160" width="360" height="20" fill="#0c4a6e" fill-opacity="0.4"/>
      
      <rect x="24" y="24" width="70" height="22" rx="4" fill="#ff7a00"/>
      <text x="32" y="39" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700">FOR SALE</text>
      
      <text x="16" y="240" fill="#ffffff" font-family="system-ui" font-size="17" font-weight="800">Seaside Horizon Villa &amp; Penthouse</text>
      <text x="16" y="260" fill="#a1a1aa" font-family="system-ui" font-size="11">Beverly Hills, California · Coastal View</text>
      
      <!-- Villa amenities -->
      <rect x="16" y="275" width="75" height="24" rx="4" fill="#262626"/>
      <text x="24" y="291" fill="#d4d4d8" font-family="system-ui" font-size="10">🛏 4 Beds</text>
      
      <rect x="99" y="275" width="75" height="24" rx="4" fill="#262626"/>
      <text x="107" y="291" fill="#d4d4d8" font-family="system-ui" font-size="10">🛁 3 Baths</text>

      <rect x="182" y="275" width="85" height="24" rx="4" fill="#262626"/>
      <text x="190" y="291" fill="#d4d4d8" font-family="system-ui" font-size="10">📐 3,850 sqft</text>

      <line x1="16" y1="315" x2="404" y2="315" stroke="#2e2e2e" stroke-width="1"/>
      
      <text x="16" y="342" fill="#a1a1aa" font-family="system-ui" font-size="10">Price</text>
      <text x="16" y="365" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="800">$2,450,000</text>
      <rect x="290" y="335" width="114" height="32" rx="6" fill="#ff7a00"/>
      <text x="310" y="355" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">View Details</text>
    </g>

    <!-- Right Sidebar property listings -->
    <g transform="translate(470, 115)">
      <!-- Listing 2 -->
      <rect width="218" height="178" rx="8" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
      <rect x="8" y="8" width="202" height="85" rx="6" fill="#27272a"/>
      <text x="12" y="112" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Metropolitan Sky Loft</text>
      <text x="12" y="128" fill="#a1a1aa" font-family="system-ui" font-size="10">Manhattan, NY · 2 Beds</text>
      <text x="12" y="155" fill="#ff7a00" font-family="system-ui" font-size="15" font-weight="800">$1,890,000</text>
      <rect x="145" y="138" width="60" height="24" rx="4" fill="#262626"/>
      <text x="156" y="154" fill="#ffffff" font-family="system-ui" font-size="10">Explore</text>

      <!-- Listing 3 -->
      <g transform="translate(0, 195)">
        <rect width="218" height="180" rx="8" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
        <rect x="8" y="8" width="202" height="85" rx="6" fill="#27272a"/>
        <text x="12" y="112" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Rustic Modern Villa</text>
        <text x="12" y="128" fill="#a1a1aa" font-family="system-ui" font-size="10">Austin, TX · 5 Beds</text>
        <text x="12" y="155" fill="#ff7a00" font-family="system-ui" font-size="15" font-weight="800">$3,150,000</text>
        <rect x="145" y="138" width="60" height="24" rx="4" fill="#262626"/>
        <text x="156" y="154" fill="#ffffff" font-family="system-ui" font-size="10">Explore</text>
      </g>
    </g>
  </g>
</svg>
