<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%">
  <defs>
    <radialGradient id="contactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="600" height="550" rx="24" fill="#0d0d0d"/>
  
  <circle cx="300" cy="275" r="240" fill="url(#contactGlow)"/>

  <!-- Geometric abstract creative sphere matrix -->
  <g transform="translate(100, 70)" filter="url(#contactShadow)">
    <circle cx="200" cy="180" r="140" fill="url(#orbGrad1)"/>
    <circle cx="200" cy="180" r="139" fill="none" stroke="#ffaa40" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Secondary overlapping abstract frosted glass ring -->
    <ellipse cx="200" cy="180" rx="190" ry="70" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-25 200 180)"/>
    <ellipse cx="200" cy="180" rx="190" ry="70" fill="none" stroke="#ff7a00" stroke-width="2" stroke-dasharray="10 10" transform="rotate(35 200 180)"/>
    
    <!-- Floating mini orb -->
    <circle cx="80" cy="90" r="35" fill="url(#orbGrad2)"/>
    <circle cx="320" cy="280" r="25" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Interactive status card -->
  <g transform="translate(120, 390)">
    <rect width="360" height="80" rx="16" fill="#171717" stroke="#2e2e2e" stroke-width="1.5"/>
    <circle cx="45" cy="40" r="8" fill="#10b981"/>
    <circle cx="45" cy="40" r="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="75" y="35" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Open to Freelance &amp; Full-Time</text>
    <text x="75" y="55" fill="#ff7a00" font-family="system-ui" font-size="12">Usually replies within 24 hours ⚡</text>
  </g>
</svg>
