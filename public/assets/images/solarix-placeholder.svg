<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="solarixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1815"/>
      <stop offset="50%" stop-color="#142c26"/>
      <stop offset="100%" stop-color="#08100e"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffaa40"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#solarixGrad)"/>
  
  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c3d35" stroke-width="0.5" stroke-opacity="0.3"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <!-- Browser Chrome -->
    <rect width="720" height="520" rx="14" fill="#0f1715" stroke="#1f3b33" stroke-width="1.5"/>
    <rect width="720" height="44" rx="14" fill="#14221f"/>
    <!-- Window controls -->
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <!-- URL Bar -->
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#0b1311" stroke="#25423a" stroke-width="1"/>
    <text x="240" y="26" fill="#6ee7b7" font-family="system-ui" font-size="11" font-weight="500">https://solarix-cleanenergy.io</text>

    <!-- App Header inside Mockup -->
    <rect x="0" y="44" width="720" height="56" fill="#0b1412" stroke-bottom="#1f3b33" stroke-width="1"/>
    <text x="32" y="79" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="800" letter-spacing="-0.5">SOLAR<tspan fill="#ff7a00">IX</tspan></text>
    <text x="140" y="77" fill="#94a3b8" font-family="system-ui" font-size="12">Solutions</text>
    <text x="220" y="77" fill="#94a3b8" font-family="system-ui" font-size="12">Analytics</text>
    <text x="300" y="77" fill="#94a3b8" font-family="system-ui" font-size="12">Hardware</text>
    <text x="380" y="77" fill="#94a3b8" font-family="system-ui" font-size="12">Enterprise</text>
    <rect x="580" y="58" width="108" height="28" rx="6" fill="url(#orangeGlow)"/>
    <text x="600" y="76" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Calculate ROI</text>

    <!-- Main Content Area -->
    <!-- Left Hero in Mockup -->
    <text x="32" y="145" fill="#10b981" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">NEXT-GEN RENEWABLE INFRASTRUCTURE</text>
    <text x="32" y="185" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="800" letter-spacing="-0.5">Intelligent Solar Grid</text>
    <text x="32" y="218" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="800" letter-spacing="-0.5">Powering Global Scale.</text>
    <text x="32" y="250" fill="#94a3b8" font-family="system-ui" font-size="12">Real-time telemetry and battery yield optimization with automated smart inverter orchestration.</text>

    <!-- Left Stats Cards -->
    <rect x="32" y="275" width="140" height="85" rx="8" fill="#132420" stroke="#22423b" stroke-width="1"/>
    <text x="44" y="298" fill="#94a3b8" font-family="system-ui" font-size="11">Peak Generation</text>
    <text x="44" y="328" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="800">4.82 <tspan font-size="14" fill="#10b981">GW/h</tspan></text>
    <text x="44" y="348" fill="#10b981" font-family="system-ui" font-size="10">↑ +18.4% Efficiency</text>

    <rect x="184" y="275" width="140" height="85" rx="8" fill="#132420" stroke="#22423b" stroke-width="1"/>
    <text x="196" y="298" fill="#94a3b8" font-family="system-ui" font-size="11">CO2 Offset YTD</text>
    <text x="196" y="328" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="800">128.4 <tspan font-size="14" fill="#ff7a00">kT</tspan></text>
    <text x="196" y="348" fill="#ff7a00" font-family="system-ui" font-size="10">Net Zero Target 2027</text>

    <!-- Right Graphic Dashboard in Mockup -->
    <rect x="350" y="125" width="340" height="360" rx="10" fill="#11201d" stroke="#22423b" stroke-width="1.5"/>
    
    <!-- Graph chart header -->
    <text x="372" y="155" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Solar Cell Output Telemetry</text>
    <text x="372" y="172" fill="#94a3b8" font-family="system-ui" font-size="11">Active Substation Matrix #402</text>
    <circle cx="660" cy="155" r="5" fill="#10b981"/>
    <text x="620" y="159" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">LIVE</text>

    <!-- Solar Chart Line -->
    <path d="M 370 290 Q 420 230 460 250 T 540 210 T 610 190 T 670 230" fill="none" stroke="url(#orangeGlow)" stroke-width="3"/>
    <path d="M 370 290 Q 420 230 460 250 T 540 210 T 610 190 T 670 230 L 670 330 L 370 330 Z" fill="url(#orangeGlow)" fill-opacity="0.12"/>
    
    <!-- Energy Grid Nodes -->
    <circle cx="460" cy="250" r="4" fill="#ff7a00"/>
    <circle cx="540" cy="210" r="5" fill="#ffffff" stroke="#ff7a00" stroke-width="2"/>
    <rect x="515" y="170" width="60" height="24" rx="4" fill="#ff7a00"/>
    <text x="525" y="186" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">98.2%</text>
    <circle cx="610" cy="190" r="4" fill="#ff7a00"/>

    <!-- Bottom sub-dashboard cards -->
    <rect x="370" y="355" width="145" height="110" rx="8" fill="#152824" stroke="#254740" stroke-width="1"/>
    <text x="385" y="380" fill="#94a3b8" font-family="system-ui" font-size="11">Battery Storage</text>
    <text x="385" y="410" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="700">94.6%</text>
    <rect x="385" y="425" width="115" height="6" rx="3" fill="#0b1714"/>
    <rect x="385" y="425" width="108" height="6" rx="3" fill="#10b981"/>
    <text x="385" y="450" fill="#6ee7b7" font-family="system-ui" font-size="10">Discharge Rate: 1.2 kW</text>

    <rect x="525" y="355" width="145" height="110" rx="8" fill="#152824" stroke="#254740" stroke-width="1"/>
    <text x="540" y="380" fill="#94a3b8" font-family="system-ui" font-size="11">Smart Inverters</text>
    <text x="540" y="410" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="700">48 / 48</text>
    <rect x="540" y="425" width="115" height="6" rx="3" fill="#0b1714"/>
    <rect x="540" y="425" width="115" height="6" rx="3" fill="#ff7a00"/>
    <text x="540" y="450" fill="#ffaa40" font-family="system-ui" font-size="10">All Units Operational</text>
  </g>
</svg>
