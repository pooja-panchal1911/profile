<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="acitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="purpleOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <filter id="acitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#acitGrad)"/>

  <!-- Background decorative elements -->
  <circle cx="700" cy="100" r="160" fill="#6366f1" fill-opacity="0.08"/>
  <circle cx="100" cy="500" r="140" fill="#ff7a00" fill-opacity="0.06"/>

  <g transform="translate(40, 40)" filter="url(#acitShadow)">
    <rect width="720" height="520" rx="14" fill="#0b0f19" stroke="#2a334a" stroke-width="1.5"/>
    <rect width="720" height="44" rx="14" fill="#131929"/>
    
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#090d16" stroke="#253047" stroke-width="1"/>
    <text x="248" y="26" fill="#a5b4fc" font-family="system-ui" font-size="11" font-weight="500">https://acit-institute.edu/courses</text>

    <!-- Header inside browser -->
    <rect x="0" y="44" width="720" height="56" fill="#0e1424" stroke-bottom="#2a334a" stroke-width="1"/>
    <rect x="32" y="58" width="32" height="32" rx="8" fill="url(#purpleOrange)"/>
    <text x="40" y="80" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="900">A</text>
    <text x="74" y="80" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="800">ACIT <tspan fill="#ff7a00" font-size="12">ACADEMY</tspan></text>
    
    <text x="220" y="78" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">All Programs</text>
    <text x="320" y="78" fill="#94a3b8" font-family="system-ui" font-size="12">Bootcamps</text>
    <text x="410" y="78" fill="#94a3b8" font-family="system-ui" font-size="12">Certifications</text>
    <text x="510" y="78" fill="#94a3b8" font-family="system-ui" font-size="12">Student Portal</text>
    
    <rect x="610" y="58" width="80" height="28" rx="6" fill="#ff7a00"/>
    <text x="625" y="76" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Enroll Now</text>

    <!-- Hero banner inside mockup -->
    <rect x="32" y="115" width="656" height="140" rx="10" fill="#131b2e" stroke="#25324d" stroke-width="1"/>
    <text x="56" y="148" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">CERTIFIED TECHNOLOGY TRAINING</text>
    <text x="56" y="180" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="800">Transform Your Tech Career With Real Industry Mentors</text>
    <text x="56" y="204" fill="#94a3b8" font-family="system-ui" font-size="12">Hands-on modern curriculum built in collaboration with top tech organizations.</text>
    <rect x="56" y="222" width="120" height="24" rx="4" fill="#6366f1"/>
    <text x="74" y="238" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="600">Explore 30+ Tracks →</text>

    <!-- 3 Course Cards -->
    <!-- Course 1 -->
    <g transform="translate(32, 275)">
      <rect width="205" height="210" rx="8" fill="#111827" stroke="#26334d" stroke-width="1"/>
      <rect width="205" height="90" rx="8" fill="#1e293b"/>
      <rect x="12" y="12" width="50" height="18" rx="4" fill="#ff7a00"/>
      <text x="18" y="25" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700">FEATURED</text>
      <text x="12" y="115" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Full Stack Web Dev</text>
      <text x="12" y="132" fill="#94a3b8" font-family="system-ui" font-size="10">React, Node, Express &amp; SQL</text>
      <text x="12" y="160" fill="#a5b4fc" font-family="system-ui" font-size="10">★ 4.9 (1.4k students)</text>
      <line x1="12" y1="172" x2="193" y2="172" stroke="#1f293d" stroke-width="1"/>
      <text x="12" y="194" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="800">$499</text>
      <text x="140" y="194" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="600">Apply →</text>
    </g>

    <!-- Course 2 -->
    <g transform="translate(257, 275)">
      <rect width="205" height="210" rx="8" fill="#111827" stroke="#ff7a00" stroke-width="1.5"/>
      <rect width="205" height="90" rx="8" fill="#1e293b"/>
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#6366f1"/>
      <text x="18" y="25" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700">POPULAR</text>
      <text x="12" y="115" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">UI/UX Design Master</text>
      <text x="12" y="132" fill="#94a3b8" font-family="system-ui" font-size="10">Figma, Design Systems &amp; Prototyping</text>
      <text x="12" y="160" fill="#a5b4fc" font-family="system-ui" font-size="10">★ 5.0 (2.1k students)</text>
      <line x1="12" y1="172" x2="193" y2="172" stroke="#1f293d" stroke-width="1"/>
      <text x="12" y="194" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="800">$449</text>
      <text x="140" y="194" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="600">Apply →</text>
    </g>

    <!-- Course 3 -->
    <g transform="translate(483, 275)">
      <rect width="205" height="210" rx="8" fill="#111827" stroke="#26334d" stroke-width="1"/>
      <rect width="205" height="90" rx="8" fill="#1e293b"/>
      <rect x="12" y="12" width="55" height="18" rx="4" fill="#10b981"/>
      <text x="18" y="25" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700">NEW</text>
      <text x="12" y="115" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Cloud &amp; DevOps</text>
      <text x="12" y="132" fill="#94a3b8" font-family="system-ui" font-size="10">AWS, Docker &amp; CI/CD Pipelines</text>
      <text x="12" y="160" fill="#a5b4fc" font-family="system-ui" font-size="10">★ 4.8 (890 students)</text>
      <line x1="12" y1="172" x2="193" y2="172" stroke="#1f293d" stroke-width="1"/>
      <text x="12" y="194" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="800">$599</text>
      <text x="140" y="194" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="600">Apply →</text>
    </g>
  </g>
</svg>
