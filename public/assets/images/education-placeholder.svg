<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="500" rx="20" fill="url(#eduBg)"/>

  <g transform="translate(40, 30)" filter="url(#eduShadow)">
    <rect width="520" height="440" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Degree Emblem graphic -->
    <g transform="translate(40, 40)">
      <circle cx="50" cy="50" r="45" fill="#ff7a00" fill-opacity="0.15" stroke="#ff7a00" stroke-width="2"/>
      <!-- Graduation cap icon -->
      <polygon points="50,28 75,40 50,52 25,40" fill="#ff7a00"/>
      <path d="M 33 46 L 33 60 C 33 68 67 68 67 60 L 67 46" fill="#ea580c"/>
      <line x1="75" y1="40" x2="75" y2="60" stroke="#ffffff" stroke-width="2"/>
      <circle cx="75" cy="62" r="3" fill="#ff7a00"/>

      <text x="120" y="38" fill="#ff7a00" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">ACADEMIC FOUNDATION</text>
      <text x="120" y="64" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="800">Bachelor of Engineering</text>
      <text x="120" y="86" fill="#94a3b8" font-family="system-ui" font-size="13">Information Technology</text>
    </g>

    <!-- Engineering Core Modules Grid -->
    <g transform="translate(40, 160)">
      <rect width="440" height="235" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <text x="20" y="32" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="700">Key Engineering Competencies</text>
      
      <g transform="translate(20, 50)">
        <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700">Data Structures &amp; Alg</text>
        <text x="14" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">High performance computing</text>
      </g>

      <g transform="translate(230, 50)">
        <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="14" y="26" fill="#ff7a00" font-family="system-ui" font-size="12" font-weight="700">Web Technologies</text>
        <text x="14" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">Full stack web architectures</text>
      </g>

      <g transform="translate(20, 130)">
        <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="14" y="26" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700">HCI &amp; UI Principles</text>
        <text x="14" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">Human-Computer Interaction</text>
      </g>

      <g transform="translate(230, 130)">
        <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="14" y="26" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="700">Software Engineering</text>
        <text x="14" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">Agile lifecycle &amp; system testing</text>
      </g>
    </g>
  </g>
</svg>
