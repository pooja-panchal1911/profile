<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pooja Panchal — UI/UX Designer & Web Developer</title>
    <meta name="description" content="Portfolio of Pooja Panchal — UI/UX Designer & Web Developer crafting modern digital experiences across React, WordPress, Webflow, and Design Systems." />
    <meta property="og:title" content="Pooja Panchal — UI/UX Designer & Web Developer" />
    <meta property="og:description" content="Designing & Building Digital Experiences That Matter. UI/UX, React, WordPress, and Webflow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('pooja_portfolio_theme');
          if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (systemPrefersDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="selection:bg-[#2563eb] selection:text-white antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
